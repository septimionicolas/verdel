name: publicar-carta

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Armar la carpeta solo con la carta
        run: |
          mkdir _site
          cp -R web/. _site/
          rm _site/moza.html _site/moza.js _site/mesas.html _site/mesas.js _site/qr-base.js
          if grep -rlE 'moza\.js|mesas\.js|mesas\.html|qr-base\.js' _site; then
            echo "La carta nombra un archivo del personal: revisalo antes de publicar."
            exit 1
          fi
          ls _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
